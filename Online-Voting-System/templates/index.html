{% extends 'layout.html' %}
{% block content %}
  <div class="text-center py-5">
    <h1 class="display-5 text-white">Welcome to the Online Voting System</h1>
    <p class="lead text-light">Register or login to cast your vote securely.</p>
    <div class="mt-4">
      {% if not current_user.is_authenticated %}
        <a class="btn btn-primary me-2" href="{{ url_for('register') }}">Register</a>
        <a class="btn btn-outline-light" href="{{ url_for('login') }}">Login</a>
      {% else %}
        <a class="btn btn-success" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
      {% endif %}
    </div>
  </div>
{% endblock %}
